<!DOCTYPE html>
<html>
<head>
    <title>Register - Bus Booking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f6f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .register-box {
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #222;
            margin-bottom: 25px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #ff7a18;
            outline: none;
            box-shadow: 0 0 5px rgba(255,122,24,0.4);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to right, #ff7a18, #ffb347);
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .footer {
            text-align: center;
            margin-top: 15px;
        }

        .footer a {
            text-decoration: none;
            color: #ff7a18;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="register-box">

    <h2>Create Account</h2>

    <form method="post">
        {% csrf_token %}

        <label>Username</label>
        <input type="text" name="username" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Register</button>
    </form>

    <div class="footer">
        <p>Already have an account?</p>
        <a href="/">Go to Login</a>
    </div>

</div>

</body>
</html>
