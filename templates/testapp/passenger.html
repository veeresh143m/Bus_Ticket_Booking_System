<!DOCTYPE html>
<html>
<head>
<title>Passenger Details</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #1e293b, #0f172a);
        color: white;
    }

    .container {
        width: 800px;
        margin: 50px auto;
        display: flex;
        background: white;
        color: black;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }

    .left {
        flex: 1;
        background: linear-gradient(135deg, #2563eb, #1e40af);
        color: white;
        padding: 30px;
    }

    .right {
        flex: 1.5;
        padding: 30px;
    }

    .seat-box {
        margin-top: 30px;
        padding: 15px;
        background: rgba(255,255,255,0.2);
        border-radius: 10px;
        font-weight: bold;
    }

    .form-group {
        margin-bottom: 15px;
    }

    input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
    }

    button {
        width: 100%;
        padding: 12px;
        background: linear-gradient(to right, #2563eb, #1e40af);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
    }

</style>

</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left">

        <h2>🧍 Passenger Details</h2>

        <p>Please confirm your booking details</p>

        <div class="seat-box">

            🚌 Bus ID: {{ request.session.bus_id }} <br><br>

            🪑 Selected Seats:

            {% for seat in request.session.seat_ids %}
                <div>Seat ID: {{ seat }}</div>
            {% endfor %}

        </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="right">

        <h2>Enter Details</h2>

        {% if error %}
            <p style="color:red; margin-bottom:12px;">{{ error }}</p>
        {% endif %}

        <form method="post" action="{% url 'payment' %}">
            {% csrf_token %}

            <div class="form-group">
                <label>Passenger Name</label>
                <input type="text" name="passenger_name" required>
            </div>

            <div class="form-group">
                <label>Mobile</label>
                <input type="text" name="mobile" required>
            </div>

            <button type="submit">Continue to Payment</button>

        </form>

    </div>

</div>

</body>
</html>
